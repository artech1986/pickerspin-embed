<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>PickerSpin Wheel</title>
<!--
  Standalone embeddable wheel.

  Deliberately not the React app. The old embed pointed an iframe at
  "/?embed=true", which loaded the entire site — router, navbar, footer, every
  content section — inside someone else's page. This file is self-contained
  vanilla JS and ships nothing it does not draw.

  Params: ?entries=A,B,C  &title=Pick+one  &theme=light|dark|auto  &color=hex
          &duration=seconds (2-20)  &remove=1 (take each winner off the wheel)
  Emits window.postMessage({type:'pickerspin:result', winner, index}) to the host.

  Stream overlay: &obs=1 is for an OBS (or Streamlabs) browser source, built
  by /spin-the-wheel-for-twitch/. The background is transparent, the wheel
  fills the source, the result shows as a large banner and the wheel ticks
  as it turns. There is no button: click the wheel or press Space in the
  source's Interact window. &button=1 brings the button back, &sound=0 mutes.
-->
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  :root{--bg:#fff;--ink:#1a1a2e;--muted:#4a4a68;--line:#e0e4e0;--brand:#2e7d32;--on-brand:#fff}
  :root[data-theme=dark]{--bg:#121218;--ink:#e8e8f0;--muted:#b0b0c8;--line:#2e2e44;--brand:#2e7d32;--on-brand:#fff}
  .wrap{width:100%;max-width:420px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
  h1{font-size:1rem;font-weight:600;margin:0;text-align:center;color:var(--ink);overflow-wrap:anywhere}
  .stage{position:relative;width:100%;aspect-ratio:1;max-width:320px}
  .stage svg{position:absolute;inset:0;width:100%;height:100%}
  #face{will-change:transform}
  #result{
    margin:0;font-size:1rem;font-weight:600;text-align:center;min-height:1.4em;
    color:var(--ink);overflow-wrap:anywhere
  }
  button{
    font:inherit;font-weight:600;font-size:1rem;
    background:var(--brand);color:var(--on-brand);border:0;border-radius:8px;
    padding:12px 28px;cursor:pointer;min-height:44px;width:100%;max-width:320px;
  }
  button:disabled{opacity:.6;cursor:default}
  button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  a.credit{font-size:.75rem;color:var(--muted);text-decoration:none}
  a.credit:hover{text-decoration:underline}
  @media (prefers-reduced-motion:reduce){#face{transition:none}}

  /* Stream overlay (&obs=1). Sized from the browser source, not a page. */
  :root.obs{--bg:transparent}
  .obs .wrap{max-width:none;height:100vh;justify-content:center;padding:2vmin}
  .obs .stage{max-width:none;width:min(94vw,72vh);cursor:pointer}
  .obs h1{font-size:clamp(1.2rem,5vmin,3rem);font-weight:800;color:#fff;
    text-shadow:0 2px 6px rgba(0,0,0,.75)}
  .obs #result{
    font-size:clamp(1.4rem,7vmin,4.5rem);font-weight:800;line-height:1.15;
    color:#fff;background:rgba(10,10,20,.82);border-radius:.4em;
    padding:.2em .6em;min-height:0;max-width:94vw
  }
  .obs #result:empty{visibility:hidden}
  .obs #result.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
  .obs a.credit{color:#fff;opacity:.7;font-size:clamp(.7rem,1.8vmin,1rem);
    text-shadow:0 1px 3px rgba(0,0,0,.8);pointer-events:none}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){.obs #result.pop{animation:none}}
</style>
</head>

      <path d="M137 4 L163 4 L150 24 Z" fill="#D32F2F" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/>
      <circle cx="150" cy="150" r="17" fill="#fff"/>
      <circle cx="150" cy="150" r="10.6" fill="#2f9e4f"/>
    </svg>
  </div>
  <p id="result" role="status" aria-live="polite"></p>
  <button id="spin" type="button">Spin</button>
  <a class="credit" id="credit" href="https://pickerspin.co/" target="_blank" rel="noopener">Powered by PickerSpin</a>
</div>

    function finish(){
      rot=norm(target);
      face.style.transform='rotate('+rot+'deg)';
      spinning=false; btn.disabled=false;
      out.textContent=entries[pick];
      if(obs){ void out.offsetWidth; out.classList.add('pop'); }
      lastWinner=pick;
      try{
        parent.postMessage({type:'pickerspin:result',winner:entries[pick],index:pick},'*');
      }catch(e){}
    }
    if(!dur){ finish(); return; }

    (function frame(now){
      var t=Math.min(1,(now-start)/dur);
      var at=rot+(target-rot)*EASE(t);
      face.style.transform='rotate('+at+'deg)';
      if(sound){ var edge=Math.floor(at/sweep); if(edge!==lastEdge){ lastEdge=edge; tick(); } }
      if(t<1) requestAnimationFrame(frame); else finish();
    })(start);
  }

  // Tell the host how tall we are, so a page can size the iframe to fit.
  function reportHeight(){
    try{
      parent.postMessage({type:'pickerspin:height',
        height:document.documentElement.scrollHeight},'*');
    }catch(e){}
  }
  window.addEventListener('load',reportHeight);
  window.addEventListener('resize',reportHeight);
})();
</script>
</body>
</html>
